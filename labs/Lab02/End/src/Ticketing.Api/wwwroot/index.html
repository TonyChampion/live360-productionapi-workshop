<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticketing Lab Client</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --line: #26304a; --text: #e6e9f0; --muted: #8b95ad;
    --accent: #f5c518; --ok: #3ecf8e; --warn: #f5a623; --bad: #ef5b5b; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  .strip { margin-left: auto; display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 13px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 3px rgba(255,255,255,.05); }
  .docs { color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; }
  .docs:hover { border-color: var(--accent); }
  .dot.Healthy { background: var(--ok); } .dot.Degraded { background: var(--warn); } .dot.Unhealthy { background: var(--bad); }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 18px; padding: 18px 20px; max-width: 1280px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  label b { color: var(--text); font-family: var(--mono); font-weight: 500; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  button { background: #222b40; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  .stack { display: grid; gap: 18px; align-content: start; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  .pill { font-family: var(--mono); font-size: 12px; padding: 2px 7px; border-radius: 999px; background: #222b40; }
  #log { font-family: var(--mono); font-size: 12.5px; max-height: 320px; overflow: auto; margin: 0; white-space: pre-wrap; }
  #log .s2 { color: var(--ok); } #log .s4 { color: var(--warn); } #log .s5, #log .err { color: var(--bad); }
  .muted { color: var(--muted); font-size: 13px; }
  #runcases button { width: 100%; text-align: left; margin-bottom: 6px; }
</style>
</head>
<body>
<header>
  <h1>Ticketing <span>Lab Client</span></h1>
  <div class="strip"><a id="docsLink" class="docs" href="/swagger/index.html" target="_blank" rel="noopener" hidden>API docs</a><span class="dot" id="healthDot"></span><span id="healthText">checking...</span></div>
</header>

<main>
  <div class="stack">
    <section>
      <h2>Chaos panel</h2>
      <p class="muted">Makes the ticket store misbehave. Used from Lab 5 on.</p>
      <label>Latency <b id="latVal">0 ms</b></label>
      <input id="lat" type="range" min="0" max="3000" step="50" value="0">
      <label>Error rate <b id="errVal">0%</b></label>
      <input id="err" type="range" min="0" max="100" step="5" value="0">
      <label><input id="avail" type="checkbox" checked> Store available</label>
      <div class="row">
        <button class="primary" id="applyChaos">Apply</button>
        <button id="resetChaos">Reset</button>
      </div>
      <div class="row">
        <button data-preset="slow">Slow (800 ms)</button>
        <button data-preset="flaky">Flaky (30%)</button>
        <button data-preset="down">Down</button>
      </div>
    </section>

    <section>
      <h2>Run cases</h2>
      <div id="runcases">
        <button data-case="smoke">Smoke test: list tickets</button>
      </div>
      <p class="muted">More run cases unlock as the labs build the features they show.</p>
    </section>
  </div>

  <div class="stack">
    <section>
      <h2>Tickets</h2>
      <div class="row" style="margin-top:0;margin-bottom:10px">
        <button id="refresh">Refresh</button>
      </div>
      <table>
        <thead><tr><th>Title</th><th>Status</th><th>Priority</th><th>Requester</th></tr></thead>
        <tbody id="tickets"><tr><td colspan="4" class="muted">Loading...</td></tr></tbody>
      </table>
    </section>

    <section>
      <h2>Request log</h2>
      <div class="row" style="margin-top:0;margin-bottom:10px">
        <button id="clearLog">Clear</button>
      </div>
      <pre id="log"></pre>
    </section>
  </div>
</main>

<script>
  // Configuration. The API version path is the one value that may change during the day.
  const config = { api: "/api/v1", health: "/health", chaos: "/dev/chaos" };
  const $ = (id) => document.getElementById(id);

  function log(method, url, status, ms, note) {
    const line = document.createElement("div");
    line.className = status ? "s" + String(status)[0] : "err";
    line.textContent = `${new Date().toLocaleTimeString()}  ${method.padEnd(4)} ${url}  ${status ?? "ERR"}  ${ms} ms${note ? "  " + note : ""}`;
    $("log").prepend(line);
  }

  async function call(method, url, body) {
    const started = performance.now();
    try {
      const res = await fetch(url, {
        method,
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined
      });
      const ms = Math.round(performance.now() - started);
      const text = await res.text();
      let data = text;
      try { data = JSON.parse(text); } catch {}
      log(method, url, res.status, ms);
      return { status: res.status, data, headers: res.headers, ms };
    } catch (e) {
      log(method, url, null, Math.round(performance.now() - started), e.message);
      return { status: 0, data: null };
    }
  }

  // Health strip: handles the plain-text default now and the JSON writer from Module 7.
  async function pollHealth() {
    try {
      const res = await fetch(config.health);
      const text = await res.text();
      let status = text.trim();
      try { status = JSON.parse(text).status ?? status; } catch {}
      $("healthDot").className = "dot " + status;
      $("healthText").textContent = `${status} (${res.status})`;
    } catch {
      $("healthDot").className = "dot Unhealthy";
      $("healthText").textContent = "API not reachable";
    }
  }

  async function loadTickets() {
    const r = await call("GET", `${config.api}/tickets`);
    const items = Array.isArray(r.data) ? r.data : (r.data?.items ?? []);
    $("tickets").innerHTML = items.length
      ? items.map(t => `<tr><td>${esc(t.title)}</td><td><span class="pill">${esc(t.status)}</span></td><td>${esc(t.priority)}</td><td>${esc(t.requesterId)}</td></tr>`).join("")
      : `<tr><td colspan="4" class="muted">No tickets (status ${r.status})</td></tr>`;
  }

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function showChaos(s) {
    $("lat").value = s.latencyMs; $("latVal").textContent = s.latencyMs + " ms";
    $("err").value = Math.round(s.errorRate * 100); $("errVal").textContent = Math.round(s.errorRate * 100) + "%";
    $("avail").checked = s.available;
  }

  async function applyChaos(state) {
    const r = await call("PUT", config.chaos, state);
    if (r.data) showChaos(r.data);
    pollHealth();
  }

  $("lat").oninput = () => $("latVal").textContent = $("lat").value + " ms";
  $("err").oninput = () => $("errVal").textContent = $("err").value + "%";
  $("applyChaos").onclick = () => applyChaos({ latencyMs: +$("lat").value, errorRate: $("err").value / 100, available: $("avail").checked });
  $("resetChaos").onclick = async () => { const r = await call("POST", `${config.chaos}/reset`); if (r.data) showChaos(r.data); pollHealth(); };
  document.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => applyChaos({
    slow:  { latencyMs: 800, errorRate: 0,   available: true },
    flaky: { latencyMs: 0,   errorRate: 0.3, available: true },
    down:  { latencyMs: 0,   errorRate: 0,   available: false }
  }[b.dataset.preset]));
  $("refresh").onclick = loadTickets;
  $("clearLog").onclick = () => { $("log").textContent = ""; };

  const runCases = { smoke: loadTickets };
  document.querySelectorAll("[data-case]").forEach(b => b.onclick = () => runCases[b.dataset.case]?.());

  (async () => {
    const r = await call("GET", config.chaos);
    if (r.data) showChaos(r.data);
    pollHealth();
    setInterval(pollHealth, 3000);
    // The API docs link appears once the API serves Swagger UI (Lab 1 on, Development only)
    fetch("/swagger/index.html", { method: "HEAD" }).then(r => { if (r.ok) $("docsLink").hidden = false; }).catch(() => {});
    loadTickets();
  })();
</script>
</body>
</html>
